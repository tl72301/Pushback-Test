name: Pushback test

on:
  workflow_dispatch:
    inputs:
      action:
        description: "run = start or continue the study. preview = free dry run. report = rebuild reports."
        type: choice
        options: [run, preview, report]
        default: run
      study:
        description: "follow-up = Sonnet 4.6, Sonnet 5, Fable 5 and Fable 5.1 (study-followup.json). replication = the replication bank on Opus and Sonnet. replication-fable = the replication bank on Fable. main = the original Opus study (finished)."
        type: choice
        options: [follow-up, replication, replication-fable, main]
        default: follow-up

permissions:
  contents: write   # save results back into the repo
  issues: write     # open an issue to notify you when it finishes or needs you
  actions: write    # a run that pauses at its time limit starts the next run for its study

jobs:
  study:
    name: ${{ inputs.study }}
    concurrency:
      group: pushback-test-${{ inputs.study }}   # one run at a time per study; a newer one waits its turn
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Start from the latest saved results
        run: |
          git fetch -q origin "${{ github.ref_name }}"
          git reset -q --hard FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Git identity for saving results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACTION: ${{ inputs.action }}
          PUSHBACK_STUDY: ${{ inputs.study == 'main' && 'study.json' || inputs.study == 'replication' && 'study-replication.json' || inputs.study == 'replication-fable' && 'study-replication-fable.json' || 'study-followup.json' }}
          PUSHBACK_AUTORESTART: "true"   # a paused run starts the next one (last step), so no "paused" issue
        run: python -u pushback.py "$ACTION"

      - name: Notify
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .notify/title.txt ]; then
            title="$(cat .notify/title.txt)"
            if gh issue list --state open --limit 200 --json title --jq '.[].title' | grep -Fxq "$title"; then
              echo "An open issue already says: $title"
            else
              gh issue create --title "$title" --body-file .notify/body.md
            fi
          fi

      - name: Continue after a pause
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .notify/continue ]; then
            gh workflow run pushback.yml --ref "${{ github.ref_name }}" -f action=run -f study="${{ inputs.study }}"
            echo "Started the next run for ${{ inputs.study }}; it begins when this one finishes."
          fi

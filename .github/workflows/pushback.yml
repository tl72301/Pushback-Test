name: Pushback test

on:
  workflow_dispatch:
    inputs:
      action:
        description: "run = start or continue the study. preview = free dry run. report = rebuild reports."
        type: choice
        options: [run, preview, report]
        default: run

permissions:
  contents: write   # save results back into the repo
  issues: write     # open an issue to notify you when it finishes or needs you

concurrency:
  group: pushback-test
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Git identity for saving results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACTION: ${{ inputs.action || 'run' }}
        run: python -u pushback.py "$ACTION"

      - name: Notify
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .notify/title.txt ]; then
            gh issue create --title "$(cat .notify/title.txt)" --body-file .notify/body.md
          fi
